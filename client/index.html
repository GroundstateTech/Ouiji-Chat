<!doctype html><html><head><meta charset="utf-8"><title>Ouiji</title><link rel="stylesheet" href="style.css"><style>
.login{width:280px;margin:38px auto;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:0 15px 35px rgba(0,0,0,.4)}
.title{color:var(--accent);font-weight:bold;letter-spacing:.12em;text-transform:uppercase}.subtitle{color:var(--muted);font-size:10px;margin-top:2px}.note{color:var(--muted);font-size:11px;background:rgba(79,195,247,.07);border:1px solid rgba(79,195,247,.15);border-radius:6px;padding:7px;margin:10px 0}.login input{width:100%;margin:5px 0}.login-actions{display:flex;justify-content:flex-end;margin-top:8px}.window{width:100%;height:100%;background:var(--panel);display:flex;flex-direction:column}.header{height:42px;padding:7px 8px;border-bottom:1px solid var(--border);background:linear-gradient(to right,var(--panel2),#151a28);display:flex;justify-content:space-between;align-items:center}.body{flex:1;overflow-y:auto;padding:6px}.section{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.12em;margin:8px 2px 4px}.dept{margin-bottom:6px}.dept-name{color:var(--accent);font-size:12px;padding:3px 4px}.person,.room{font-size:12px;padding:4px 4px 4px 12px;border-radius:4px;display:flex;align-items:center;gap:5px;user-select:none}.person:hover,.room:hover{background:var(--hover)}.dot{width:8px;height:8px;border-radius:50%;background:var(--gray)}.dot.Online{background:var(--green)}.dot.Busy,.dot.Away{background:var(--yellow)}.dot.Meeting{background:var(--red)}.name{flex:1}.role{color:var(--muted);font-size:10px}.footer{height:44px;border-top:1px solid var(--border);padding:5px 6px;display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--muted)}#menu{position:fixed;display:none;z-index:99;background:var(--panel2);border:1px solid var(--border);border-radius:4px;min-width:150px;box-shadow:0 10px 25px rgba(0,0,0,.5)}.mi{padding:7px 9px;font-size:12px}.mi:hover{background:var(--hover)}#toast{position:fixed;bottom:50px;left:8px;right:8px;background:var(--panel2);border:1px solid var(--border);font-size:11px;padding:6px;display:none;border-radius:6px}
</style></head><body>
<audio id="snd-online" src="../sounds/online.wav"></audio><audio id="snd-offline" src="../sounds/offline.wav"></audio>
<div id="app"></div><div id="menu"></div><div id="toast"></div>
<script>
const params=new URLSearchParams(location.search),SERVER_URL=params.get("serverUrl")||"ws://localhost:8080/ws",COMPANY=params.get("companyName")||"Groundstate";let ws,currentUser=null,directory={departments:[],users:[],projects:[]},menuTarget=null;
function sound(id){const a=document.getElementById(id);try{a.currentTime=0;a.play()}catch{}}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.style.display="block";setTimeout(()=>t.style.display="none",2200)}
function connect(){ws=new WebSocket(SERVER_URL);ws.onopen=()=>toast("Connected");ws.onclose=()=>toast("Disconnected");ws.onerror=()=>toast("Connection error");ws.onmessage=ev=>{const d=JSON.parse(ev.data);if(d.type==="auth"){if(d.success){currentUser=d.username;directory={departments:d.departments||[],users:d.users||[],projects:d.projects||[]};render()}else alert(d.message||"Login failed")}if(d.type==="directory"){directory={departments:d.departments||[],users:d.users||[],projects:d.projects||[]};render()}if(d.type==="buddyOnline"&&d.username!==currentUser){sound("snd-online");toast(d.username+" signed on")}if(d.type==="buddyOffline"&&d.username!==currentUser){sound("snd-offline");toast(d.username+" signed off")}}}
function renderLogin(){document.getElementById("app").innerHTML=`<div class="login"><div class="title">Ouiji</div><div class="subtitle">${COMPANY} Internal Network</div><div class="note">Login with an employee account.<br>Demo password: <b>password</b></div><input id="username" placeholder="Username" onkeydown="if(event.key==='Enter')login()"><input id="password" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')login()"><div class="login-actions"><button class="primary" onclick="login()">Sign In</button></div></div>`}
function render(){if(!currentUser)return renderLogin();const usersByDept={};for(const u of directory.users){if(u.username===currentUser)continue;if(!usersByDept[u.departmentId])usersByDept[u.departmentId]=[];usersByDept[u.departmentId].push(u)}const deptHtml=directory.departments.map(d=>`<div class="dept"><div class="dept-name">${d.name}</div>${(usersByDept[d.id]||[]).map(u=>`<div class="person" ondblclick="openDM('${u.username}')" oncontextmenu="openMenu(event,'${u.username}')"><span class="dot ${u.status}"></span><span class="name">${u.displayName}</span><span class="role">${u.role}</span></div>`).join("")}</div>`).join("");const rooms=[...directory.departments.map(d=>({name:d.name,type:"Dept"})),...directory.projects.map(p=>({name:p.name+"-General",type:"Project"}))];const roomHtml=rooms.map(r=>`<div class="room" ondblclick="openRoom('${r.name}')"><span class="dot Online"></span><span class="name">${r.name}</span><span class="role">${r.type}</span></div>`).join("");document.getElementById("app").innerHTML=`<div class="window"><div class="header"><div><div class="title">Ouiji Chat</div><div class="subtitle">${COMPANY}</div></div><button class="small-btn" onclick="refresh()">↻</button></div><div class="body"><div class="section">Departments</div>${deptHtml}<div class="section">Rooms</div>${roomHtml}</div><div class="footer"><span>${currentUser}</span><span><button class="small-btn" onclick="setStatus()">Status</button> <button class="small-btn" onclick="openCard('${currentUser}')">Card</button></span></div></div>`;renderMenu()}
function login(){if(!ws||ws.readyState!==1){alert("Not connected to server yet.");return}ws.send(JSON.stringify({type:"login",username:document.getElementById("username").value,password:document.getElementById("password").value}))}
function refresh(){ws.send(JSON.stringify({type:"getDirectory"}))}function openDM(u){window.ouijiAPI.openDM(currentUser,u)}function openRoom(r){window.ouijiAPI.openRoom(currentUser,r)}function openCard(u){window.ouijiAPI.openCard(currentUser,u)}
function setStatus(){const s=prompt("Status: Online, Busy, Meeting, Away","Online");if(!s)return;const m=prompt("Status message","");ws.send(JSON.stringify({type:"setStatus",status:s,statusMessage:m||""}))}
function openMenu(e,u){e.preventDefault();menuTarget=u;renderMenu(e.clientX,e.clientY)}function renderMenu(x,y){const m=document.getElementById("menu");if(x==null){m.style.display="none";return}m.innerHTML=`<div class="mi" onclick="openDM(menuTarget);renderMenu()">Message</div><div class="mi" onclick="openCard(menuTarget);renderMenu()">Employee Card</div>`;m.style.left=x+"px";m.style.top=y+"px";m.style.display="block"}document.addEventListener("click",()=>renderMenu());
connect();renderLogin();
</script></body></html>
