<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self'; connect-src ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ouiji Chat</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body{display:flex;flex-direction:column;overflow:hidden}.header{min-height:48px;padding:8px 10px;border-bottom:1px solid var(--border);background:linear-gradient(to right,var(--panel2),#151a28);display:flex;align-items:center;justify-content:space-between;gap:10px}.title{color:var(--accent);font-weight:bold}.subtitle{color:var(--muted);font-size:10px}.state{font-size:9px;color:var(--muted);border:1px solid var(--border);padding:3px 7px;border-radius:20px}.state[data-state="online"]{color:var(--green)}.state[data-state="connecting"]{color:var(--yellow)}#chat{flex:1;overflow-y:auto;background:var(--panel2);padding:10px;font-size:13px}.msg{max-width:78%;margin:8px 0}.msg.me{margin-left:auto}.msg-meta{font-size:9px;color:var(--muted);margin:0 4px 2px}.msg.me .msg-meta{text-align:right}.msg-body{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:7px 9px;white-space:pre-wrap;overflow-wrap:anywhere}.msg.me .msg-body{background:rgba(79,195,247,.09);border-color:rgba(79,195,247,.25)}.receipt{font-size:9px;color:var(--muted);text-align:right;margin:3px 4px 0}.receipt.delivered{color:#91b7c7}.receipt.read{color:var(--accent)}.input{min-height:48px;display:flex;gap:6px;padding:7px;border-top:1px solid var(--border);background:var(--panel)}.input input{flex:1}.input button:disabled{opacity:.45;cursor:not-allowed}
  </style>
</head>
<body>
  <audio id="snd-send" src="../sounds/send.wav"></audio>
  <audio id="snd-incoming" src="../sounds/incoming.wav"></audio>
  <header class="header"><div><div class="title" id="title">Chat</div><div class="subtitle" id="subtitle"></div></div><div id="state" class="state" data-state="offline">Disconnected</div></header>
  <main id="chat" aria-live="polite"></main>
  <div class="input"><input id="text" maxlength="4000" autocomplete="off" placeholder="Type message…" disabled><button class="primary" id="sendBtn" disabled>Send</button></div>
  <script src="chat.js"></script>
</body>
</html>
