<!doctype html><html><head><meta charset="utf-8"><title>Ouiji Chat</title><link rel="stylesheet" href="style.css"><style>
body{display:flex;flex-direction:column}.header{height:42px;padding:8px 10px;border-bottom:1px solid var(--border);background:linear-gradient(to right,var(--panel2),#151a28)}.title{color:var(--accent);font-weight:bold}.subtitle{color:var(--muted);font-size:11px}#chat{flex:1;overflow-y:auto;background:var(--panel2);padding:8px;font-size:13px}.msg{margin:5px 0}.me{text-align:right}.sender{color:var(--accent);font-weight:bold}.me .sender{color:#9ccc65}.input{height:42px;display:flex;gap:6px;padding:6px;border-top:1px solid var(--border);background:var(--panel)}.input input{flex:1}
</style></head><body><audio id="snd-send" src="../sounds/send.wav"></audio><audio id="snd-incoming" src="../sounds/incoming.wav"></audio><div class="header"><div class="title" id="title">Chat</div><div class="subtitle" id="subtitle"></div></div><div id="chat"></div><div class="input"><input id="text" placeholder="Type message..." onkeydown="if(event.key==='Enter')sendMsg()"><button class="primary" onclick="sendMsg()">Send</button></div><script>
const p=new URLSearchParams(location.search),SERVER_URL=p.get("serverUrl")||"ws://localhost:8080/ws",viewer=p.get("viewer"),kind=p.get("kind"),buddy=p.get("buddy"),room=p.get("room"),target=kind==="dm"?buddy:room;let ws,messages=[];document.getElementById("title").textContent=target;document.getElementById("subtitle").textContent=kind==="dm"?"Direct Message":"Room Chat";function sound(id){const a=document.getElementById(id);try{a.currentTime=0;a.play()}catch{}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function render(){const b=document.getElementById("chat");b.innerHTML=messages.map(m=>`<div class="msg ${m.from===viewer?'me':''}"><span class="sender">${m.from===viewer?'Me':m.from}:</span> ${esc(m.text)}</div>`).join("");b.scrollTop=b.scrollHeight}function connect(){ws=new WebSocket(SERVER_URL);ws.onopen=()=>{ws.send(JSON.stringify({type:"registerClient",username:viewer}));if(kind==="dm")ws.send(JSON.stringify({type:"getConversation",username:viewer,buddy}));else ws.send(JSON.stringify({type:"joinRoom",username:viewer,room}))};ws.onmessage=ev=>{const d=JSON.parse(ev.data);if(d.type==="conversationHistory"&&kind==="dm"){messages=d.messages||[];render()}if(d.type==="roomHistory"&&kind==="room"&&d.room===room){messages=d.messages||[];render()}if(d.type==="message"&&kind==="dm"){if((d.from===viewer&&d.to===buddy)||(d.from===buddy&&d.to===viewer)){messages.push(d);render();if(d.from!==viewer)sound("snd-incoming")}}if(d.type==="roomMessage"&&kind==="room"&&d.room===room){messages.push(d);render();if(d.from!==viewer)sound("snd-incoming")}}}function sendMsg(){const i=document.getElementById("text"),text=i.value.trim();if(!text||!ws||ws.readyState!==1)return;if(kind==="dm")ws.send(JSON.stringify({type:"dmSend",to:buddy,text}));else ws.send(JSON.stringify({type:"roomSend",room,text}));i.value="";sound("snd-send")}connect();
</script></body></html>
