<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src ws: wss:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Employee Card</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .header{min-height:48px;padding:8px 10px;border-bottom:1px solid var(--border);background:linear-gradient(to right,var(--panel2),#151a28);display:flex;align-items:center;justify-content:space-between}.title{color:var(--accent);font-weight:bold}.state{font-size:9px;color:var(--muted);border:1px solid var(--border);padding:3px 7px;border-radius:20px}.state[data-state="online"]{color:var(--green)}.state[data-state="connecting"]{color:var(--yellow)}.card{padding:16px}.avatar{width:68px;height:68px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--accent);margin-bottom:12px;box-shadow:0 0 24px rgba(79,195,247,.08)}.row{margin:7px 0;color:var(--muted);font-size:13px}.row strong{color:var(--text)}.status{margin-top:14px;padding:9px;border:1px solid var(--border);background:var(--panel2);border-radius:7px}.status strong{display:block;color:var(--accent);margin-bottom:3px}.status div{color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <header class="header"><div class="title">Employee Card</div><div id="state" class="state" data-state="offline">Disconnected</div></header>
  <main id="card" class="card">Loading…</main>
  <script src="employee-card.js"></script>
</body>
</html>
