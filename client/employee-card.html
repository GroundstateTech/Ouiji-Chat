<!doctype html><html><head><meta charset="utf-8"><title>Employee Card</title><link rel="stylesheet" href="style.css"><style>
.header{height:42px;padding:8px 10px;border-bottom:1px solid var(--border);background:linear-gradient(to right,var(--panel2),#151a28)}.title{color:var(--accent);font-weight:bold}.card{padding:14px}.avatar{width:64px;height:64px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:30px;color:var(--accent);margin-bottom:10px}.row{margin:6px 0;color:var(--muted);font-size:13px}.row b{color:var(--text)}.status{margin-top:12px;padding:8px;border:1px solid var(--border);background:var(--panel2);border-radius:6px}
</style></head><body><div class="header"><div class="title">Employee Card</div></div><div id="card" class="card">Loading...</div><script>
const p=new URLSearchParams(location.search),SERVER_URL=p.get("serverUrl")||"ws://localhost:8080/ws",viewer=p.get("viewer"),target=p.get("target");let ws;function connect(){ws=new WebSocket(SERVER_URL);ws.onopen=()=>{ws.send(JSON.stringify({type:"registerClient",username:viewer}));ws.send(JSON.stringify({type:"getEmployeeCard",username:target}))};ws.onmessage=ev=>{const d=JSON.parse(ev.data);if(d.type==="employeeCard")render(d.user)}}function render(u){if(!u){document.getElementById("card").textContent="Employee not found.";return}document.getElementById("card").innerHTML=`<div class="avatar">${u.displayName?u.displayName[0].toUpperCase():"?"}</div><div class="row"><b>Name:</b> ${u.displayName}</div><div class="row"><b>Department:</b> ${u.department}</div><div class="row"><b>Role:</b> ${u.role}</div><div class="row"><b>Email:</b> ${u.email}</div><div class="row"><b>Extension:</b> ${u.extension}</div><div class="row"><b>Location:</b> ${u.location}</div><div class="status"><b>${u.status}</b><br>${u.statusMessage||""}</div>`}connect();
</script></body></html>
