name: Windows Package

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'server/**'
      - 'sounds/**'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/windows-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify project
        run: npm run verify
      - name: Package Windows x64
        run: npm run package-win
      - name: Upload packaged application
        uses: actions/upload-artifact@v7
        with:
          name: Ouiji-InHouse-Windows-x64-${{ github.sha }}
          path: artifacts/Ouiji-InHouse-win32-x64/
          if-no-files-found: error
          retention-days: 14
