name: Sync Lockfile

on:
  push:
    branches: [release/public-hardening-v3.2]
    paths:
      - 'package.json'
      - '.github/workflows/sync-lock.yml'

permissions:
  contents: write

jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/public-hardening-v3.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --package-lock-only --ignore-scripts
      - shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json
          git commit -m "chore: sync package lockfile"
          git push origin HEAD:release/public-hardening-v3.2
